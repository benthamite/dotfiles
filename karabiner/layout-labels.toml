# Diagram labels for simlayer keys, read by generate-layouts.py.
#
# A label here overrides the one derived from the rule's action. Keys
# whose action is a raw keystroke (e.g. {:modi :C-H- :key :u}) need one,
# since the published code blocks carry no comments; without it the key
# is drawn blank, which is right only when the keystroke runs nothing.
# Emacs labels name the command the keystroke runs in Emacs. j-mode and
# z-mode have an .emacs and a .macos table, one per diagram.
#
# generate-layouts.py fails when a label names a key its layer does not
# bind, so a removed binding cannot leave a stale label behind.

[b-mode]
u = "Left half"
i = "Maximize"
o = "Center"
p = "Right half"
g = "Dict lang"
h = "Dictation"
x = "Copy screen"
c = "Bluetooth"
n = "Narration"

